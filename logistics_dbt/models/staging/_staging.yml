version: 2

models:
  - name: stg_shipments
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'in_transit', 'delayed']
      - name: quantity
        tests:
          - not_null
      - name: cost
        tests:
          - not_null
